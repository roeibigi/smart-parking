server {
    listen 80;

    # The dashboard files (HTML / CSS / JS)
    location / {
        root /usr/share/nginx/html;
    }

    # The browser can't reach "api" (that name exists only inside Docker),
    # so the browser calls /api/... on nginx and nginx forwards it to the API.
    location /api/ {
        proxy_pass http://api:5000;
    }
}
