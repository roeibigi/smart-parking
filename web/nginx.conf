server {
    listen 80;

    # The dashboard files (HTML / CSS / JS)
    location / {
        root /usr/share/nginx/html;
        # Make the browser check for a newer version every time, so after a
        # rebuild it never keeps running an old cached app.js.
        add_header Cache-Control "no-cache";
    }

    # The browser can't reach "api" (that name exists only inside Docker),
    # so the browser calls /api/... on nginx and nginx forwards it to the API.
    location /api/ {
        proxy_pass http://api:5000;
    }
}
